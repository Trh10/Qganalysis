<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG Analysis – Lecture</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0f1120;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            color: #fff;
            min-height: 100vh;
        }

        .viewer-header {
            background: rgba(15,17,32,0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .viewer-header .vh-logo img { height: 56px; display: block; }
        .viewer-header .vh-actions { display: flex; gap: 10px; align-items: center; }
        .vh-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .vh-btn-back {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .vh-btn-back:hover { background: rgba(255,255,255,0.14); }
        .vh-btn-download { background: #dc002e; color: #fff; }
        .vh-btn-download:hover { background: #b50025; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(220,0,46,0.35); }

        .viewer-hero {
            background: linear-gradient(135deg, #1a1d2e 0%, #0f1120 100%);
            position: relative;
            padding: 50px 40px 40px;
            overflow: hidden;
        }
        .viewer-hero::before {
            content: '';
            position: absolute;
            top: -120px; right: -120px;
            width: 380px; height: 380px;
            background: radial-gradient(circle, rgba(220,0,46,0.18) 0%, transparent 70%);
            pointer-events: none;
        }
        .viewer-hero-inner {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .viewer-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(220,0,46,0.15);
            color: #ff5174;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            padding: 7px 16px;
            border-radius: 30px;
            margin-bottom: 18px;
            border: 1px solid rgba(220,0,46,0.25);
        }
        .viewer-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.9rem, 3.6vw, 2.8rem);
            font-weight: 800;
            line-height: 1.12;
            margin: 0 0 16px;
            background: linear-gradient(135deg, #ffffff 0%, #b8bce0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .viewer-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            color: #8a8fb0;
            font-size: 0.88rem;
        }
        .viewer-meta span { display: inline-flex; align-items: center; gap: 7px; }
        .viewer-meta i { color: #dc002e; }
        .viewer-desc {
            font-size: 1.05rem;
            line-height: 1.65;
            color: #c8ccdf;
            max-width: 880px;
            margin: 0;
            font-weight: 300;
        }

        .viewer-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 26px 24px 60px;
        }
        .pdf-shell {
            background: #1a1d2e;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .pdf-toolbar {
            background: linear-gradient(180deg, #2a2d44 0%, #232639 100%);
            padding: 11px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .pdf-toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8a8fb0;
            font-size: 0.82rem;
            min-width: 0;
        }
        .pdf-toolbar-left i.fa-file-pdf { color: #dc002e; font-size: 1.05rem; }
        .toolbar-filename {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50vw;
        }
        .pdf-toolbar-right { display: flex; gap: 8px; }
        .pdf-tool-btn {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            width: 34px; height: 34px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .pdf-tool-btn:hover { background: #dc002e; border-color: #dc002e; }

        .pdf-frame {
            width: 100%;
            height: calc(100vh - 120px);
            min-height: 820px;
            border: none;
            display: block;
            background: #2a2d44;
        }
        .pdf-viewer-wrap {
            position: relative;
            min-height: 820px;
            background: #2a2d44;
        }
        .pdf-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #2a2d44;
            color: #c8ccdf;
            z-index: 2;
            transition: opacity 0.25s ease;
        }
        .pdf-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .pdf-loading i {
            font-size: 2rem;
            color: #dc002e;
        }
        .pdf-loading p {
            margin: 0;
            font-size: 0.92rem;
        }
        .pdf-loading small {
            color: #8a8fb0;
            font-size: 0.78rem;
        }
        .pdf-fallback {
            display: none;
            padding: 28px;
            text-align: center;
            color: #c8ccdf;
        }
        .pdf-fallback.show { display: block; }
        .pdf-fallback a {
            color: #ff6b88;
            font-weight: 600;
        }

        /* Vue mobile dédiée pour les PDF */
        .mobile-pdf-card {
            background: linear-gradient(160deg, #1a1d2e 0%, #13162a 100%);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0,0,0,0.55);
        }
        .mobile-pdf-preview {
            position: relative;
            background: #0f1120;
            aspect-ratio: 3 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .mobile-pdf-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .mobile-pdf-preview-placeholder {
            text-align: center;
            padding: 30px;
            width: 100%;
        }
        .mobile-pdf-preview-placeholder i {
            font-size: 4.5rem;
            color: #dc002e;
            margin-bottom: 14px;
            filter: drop-shadow(0 6px 20px rgba(220,0,46,0.5));
        }
        .mobile-pdf-preview-placeholder p {
            color: #8a8fb0;
            font-size: 0.85rem;
            margin: 0;
        }
        .mobile-pdf-preview::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 60%;
            background: linear-gradient(180deg, transparent 0%, rgba(15,17,32,0.85) 60%, #13162a 100%);
            pointer-events: none;
        }
        .mobile-pdf-info {
            padding: 22px 22px 24px;
            text-align: center;
            position: relative;
            z-index: 1;
            margin-top: -60px;
        }
        .mobile-pdf-filename {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.78rem;
            color: #c8ccdf;
            margin-bottom: 16px;
            max-width: 100%;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .mobile-pdf-filename i { color: #dc002e; }
        .mobile-pdf-filename span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .mobile-cta-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #dc002e;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            font-size: 1rem;
            border: none;
            box-shadow: 0 12px 30px -8px rgba(220,0,46,0.55);
            margin-bottom: 10px;
            font-family: 'Poppins', sans-serif;
        }
        .mobile-cta-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: rgba(255,255,255,0.06);
            color: #c8ccdf;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
            font-family: 'Poppins', sans-serif;
        }
        .pdf-size-note {
            color: #8a8fb0;
            font-size: 0.84rem;
            line-height: 1.55;
            margin: 0 0 14px;
        }
        .desktop-pdf-card {
            max-width: 720px;
            margin: 0 auto;
        }
        .load-pdf-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #dc002e;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            box-shadow: 0 12px 30px -8px rgba(220,0,46,0.55);
            margin-bottom: 10px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
        }
        .load-pdf-btn:hover { background: #b50025; }
        .pdf-shell.fullscreen {
            position: fixed;
            inset: 0;
            border-radius: 0;
            z-index: 9999;
            border: none;
        }
        .pdf-shell.fullscreen .pdf-frame { height: calc(100vh - 56px); min-height: 0; }

        .viewer-cover {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 14px;
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.4);
            margin-bottom: 24px;
            display: block;
        }

        .article-reader {
            max-width: 980px;
            margin: 0 auto;
        }
        .article-cover {
            width: 100%;
            max-height: 560px;
            object-fit: cover;
            object-position: center;
            border-radius: 14px;
            box-shadow: 0 24px 60px -18px rgba(0,0,0,0.65);
            margin-bottom: 34px;
            display: block;
        }
        .article-body {
            padding: 4px 0 20px;
        }
        .article-byline {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #ff6b88;
            font-size: 0.86rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }
        .article-byline i {
            color: #dc002e;
        }
        .article-lead {
            font-family: 'Outfit', sans-serif;
            font-size: 1.18rem;
            line-height: 1.82;
            color: #f3f4fb;
            font-weight: 400;
            margin: 0 0 36px;
            padding: 22px 0 22px 26px;
            border-left: 4px solid #dc002e;
        }
        .article-body h2 {
            font-family: 'Outfit', sans-serif;
            color: #fff;
            font-size: 1.38rem;
            line-height: 1.35;
            font-weight: 800;
            margin: 46px 0 16px;
        }
        .article-body p {
            color: #d6d9e8;
            font-size: 1.01rem;
            line-height: 1.92;
            font-weight: 300;
            margin: 0 0 21px;
        }
        .article-signature {
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.06rem;
            font-weight: 700;
            margin-top: 38px;
            padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,0.12);
        }

        .no-pdf, .error-box {
            background: #1a1d2e;
            padding: 70px 30px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .no-pdf i, .error-box i { font-size: 3rem; color: #dc002e; margin-bottom: 16px; opacity: 0.7; }
        .no-pdf h3, .error-box h3 { font-family: 'Outfit', sans-serif; color: #fff; margin: 0 0 8px; font-size: 1.4rem; }
        .no-pdf p, .error-box p { color: #8a8fb0; margin: 0; }
        .error-box { max-width: 600px; margin: 80px auto; }

        @media (max-width: 768px) {
            .viewer-header { padding: 12px 18px; }
            .viewer-header .vh-logo img { height: 44px; }
            .viewer-hero { padding: 34px 20px 26px; }
            .viewer-title { font-size: 1.68rem; line-height: 1.18; overflow-wrap: break-word; }
            .viewer-desc { font-size: 0.96rem; overflow-wrap: break-word; }
            .viewer-content { padding: 18px 14px 40px; }
            .vh-btn { padding: 8px 12px; font-size: 0.78rem; }
            .vh-btn-back span, .vh-btn-download span { display: none; }
            .article-cover { max-height: 420px; border-radius: 12px; margin-bottom: 24px; }
            .article-lead { font-size: 1.04rem; line-height: 1.72; padding-left: 18px; }
            .article-body h2 { font-size: 1.18rem; margin-top: 36px; }
            .article-body p { font-size: 0.96rem; line-height: 1.82; }
        }
    </style>
</head>
<body>

    <header class="viewer-header">
        <a href="index.html" class="vh-logo">
            <img src="LOGO_QG2CRISES.png" alt="QG Analysis">
        </a>
        <div class="vh-actions">
            <a href="index.html" class="vh-btn vh-btn-back"><i class="fas fa-arrow-left"></i> <span>Retour</span></a>
            <a href="#" class="vh-btn vh-btn-download" id="downloadBtn" style="display:none;">
                <i class="fas fa-download"></i> <span>Télécharger</span>
            </a>
        </div>
    </header>

    <div id="viewerRoot"></div>

    <script>
        (function() {
            var months = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

            function formatDate(d) {
                if (!d) return '';
                var parts = d.split('-');
                return months[parseInt(parts[1],10)-1] + ' ' + parts[0];
            }
            function escapeHtml(s) {
                var div = document.createElement('div');
                div.appendChild(document.createTextNode(s == null ? '' : String(s)));
                return div.innerHTML;
            }
            function getParam(name) {
                return new URLSearchParams(window.location.search).get(name);
            }
            function normalizeContentId(value) {
                var clean = (value || '').trim();
                var numericPrefix = clean.match(/^(\d+)(?=[?&#\s]|$)/);
                return numericPrefix ? numericPrefix[0] : clean;
            }
            function hasArticleContent(item) {
                return Array.isArray(item.content) && item.content.length > 0;
            }
            function renderContentBlock(block) {
                if (!block || !block.text) return '';
                var text = escapeHtml(block.text);
                if (block.type === 'heading') return '<h2>' + text + '</h2>';
                if (block.type === 'lead') return '<p class="article-lead">' + text + '</p>';
                if (block.type === 'signature') return '<p class="article-signature">' + text + '</p>';
                return '<p>' + text + '</p>';
            }
            function renderArticleBody(item) {
                var coverHtml = item.image ? '<img class="article-cover" src="' + item.image + '" alt="' + escapeHtml(item.title) + '">' : '';
                var bylineHtml = item.author ? '<div class="article-byline"><i class="fas fa-user-pen"></i><span>' + escapeHtml(item.author) + '</span></div>' : '';
                var contentHtml = item.content.map(renderContentBlock).join('');
                return '<article class="article-reader">' + coverHtml + '<div class="article-body">' + bylineHtml + contentHtml + '</div></article>';
            }

            var type = getParam('type');
            var id = normalizeContentId(getParam('id'));
            var root = document.getElementById('viewerRoot');

            if (!type || !id || (type !== 'rapport' && type !== 'article')) {
                root.innerHTML = '<div class="error-box"><i class="fas fa-triangle-exclamation"></i><h3>Lien invalide</h3><p>Aucun article spécifié.</p></div>';
                return;
            }

            var endpoint = type === 'rapport' ? '/api/rapports/' : '/api/articles/';
            var LARGE_PDF_BYTES = 20 * 1024 * 1024;

            fetch(endpoint + encodeURIComponent(id)).then(function(r) {
                if (!r.ok) throw new Error('not found');
                return r.json();
            }).then(function(item) {
                if (!item.pdf) {
                    renderItem(type, item, 0);
                    return;
                }
                fetch(item.pdf, { method: 'HEAD', credentials: 'same-origin' }).then(function(headRes) {
                    var size = parseInt(headRes.headers.get('content-length') || '0', 10);
                    renderItem(type, item, isNaN(size) ? 0 : size);
                }).catch(function() {
                    renderItem(type, item, 0);
                });
            }).catch(function() {
                root.innerHTML = '<div class="error-box"><i class="fas fa-triangle-exclamation"></i><h3>Contenu introuvable</h3><p>Cet article ou rapport n\'existe plus.</p></div>';
            });

            function formatFileSize(bytes) {
                if (!bytes || bytes <= 0) return '';
                if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' Ko';
                return (bytes / (1024 * 1024)).toFixed(1).replace('.0', '') + ' Mo';
            }

            function setupDownloadBtn(item, pdfFileName) {
                var dl = document.getElementById('downloadBtn');
                dl.href = item.pdf;
                dl.style.display = 'inline-flex';
                dl.addEventListener('click', function(e) {
                    e.preventDefault();
                    var link = document.createElement('a');
                    link.href = item.pdf;
                    link.download = pdfFileName;
                    link.rel = 'noopener';
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                });
            }

            function buildPdfCardHtml(item, pdfFileName, sizeBytes, cardClass, preferNewTab) {
                var previewInner = item.image
                    ? '<img src="' + item.image + '" alt="' + escapeHtml(item.title) + '">'
                    : '<div class="mobile-pdf-preview-placeholder"><i class="fas fa-file-pdf"></i><p>Document PDF</p></div>';
                var sizeLabel = formatFileSize(sizeBytes);
                var sizeNote = sizeLabel
                    ? '<p class="pdf-size-note">Document volumineux (' + sizeLabel + '). Le chargement peut prendre 1 à 2 minutes selon votre connexion.</p>'
                    : '<p class="pdf-size-note">Document volumineux. Le chargement peut prendre 1 à 2 minutes selon votre connexion.</p>';
                var actionHtml = preferNewTab
                    ? '<a class="mobile-cta-primary" href="' + item.pdf + '" target="_blank" rel="noopener"><i class="fas fa-book-open"></i> Lire le document</a>'
                    : '<button type="button" class="load-pdf-btn" id="loadPdfInlineBtn"><i class="fas fa-book-open"></i> Afficher le PDF</button>' +
                      '<a class="mobile-cta-secondary" href="' + item.pdf + '" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> Ouvrir dans un nouvel onglet</a>';
                return '<div class="mobile-pdf-card ' + cardClass + '" id="pdfCard">' +
                    '<div class="mobile-pdf-preview">' + previewInner + '</div>' +
                    '<div class="mobile-pdf-info">' +
                        '<div class="mobile-pdf-filename"><i class="fas fa-file-pdf"></i><span>' + escapeHtml(pdfFileName) + '</span></div>' +
                        sizeNote +
                        actionHtml +
                    '</div>' +
                '</div>' +
                '<div id="pdfInlineHost"></div>';
            }

            function buildPdfIframeHtml(item, pdfFileName, sizeBytes) {
                var sizeLabel = formatFileSize(sizeBytes);
                var loadingHint = sizeLabel
                    ? '<small>Document ' + sizeLabel + ' — merci de patienter</small>'
                    : '';
                return '<div class="pdf-shell" id="pdfShell">' +
                    '<div class="pdf-toolbar">' +
                        '<div class="pdf-toolbar-left">' +
                            '<i class="fas fa-file-pdf"></i>' +
                            '<span class="toolbar-filename">' + escapeHtml(pdfFileName) + '</span>' +
                        '</div>' +
                        '<div class="pdf-toolbar-right">' +
                            '<button class="pdf-tool-btn" id="fullscreenBtn" title="Plein écran"><i class="fas fa-expand"></i></button>' +
                            '<a class="pdf-tool-btn" href="' + item.pdf + '" target="_blank" rel="noopener" title="Ouvrir dans un nouvel onglet"><i class="fas fa-up-right-from-square"></i></a>' +
                        '</div>' +
                    '</div>' +
                    '<div class="pdf-viewer-wrap">' +
                        '<div class="pdf-loading" id="pdfLoading">' +
                            '<i class="fas fa-spinner fa-spin"></i>' +
                            '<p>Chargement du document PDF...</p>' +
                            loadingHint +
                        '</div>' +
                        '<iframe class="pdf-frame" id="pdfFrame" src="' + item.pdf + '#toolbar=1&navpanes=0&view=FitH" title="' + escapeHtml(item.title) + '"></iframe>' +
                        '<div class="pdf-fallback" id="pdfFallback">' +
                            '<p>Le document est volumineux ou ne peut pas s\'afficher ici.</p>' +
                            '<p><a href="' + item.pdf + '" target="_blank" rel="noopener">Ouvrir le PDF dans un nouvel onglet</a></p>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }

            function mountPdfIframe(item, pdfFileName, sizeBytes, hostEl) {
                hostEl.innerHTML = buildPdfIframeHtml(item, pdfFileName, sizeBytes);
                setupFullscreen();
                var pdfFrame = document.getElementById('pdfFrame');
                var pdfLoading = document.getElementById('pdfLoading');
                var pdfFallback = document.getElementById('pdfFallback');
                if (!pdfFrame) return;
                var hideLoading = function() {
                    if (pdfLoading) pdfLoading.classList.add('hidden');
                };
                pdfFrame.addEventListener('load', hideLoading);
                setTimeout(hideLoading, 20000);
                setTimeout(function() {
                    if (pdfLoading && !pdfLoading.classList.contains('hidden') && pdfFallback) {
                        pdfFallback.classList.add('show');
                    }
                }, 45000);
            }

            function setupFullscreen() {
                var fsBtn = document.getElementById('fullscreenBtn');
                if (!fsBtn) return;
                fsBtn.addEventListener('click', function() {
                    var shell = document.getElementById('pdfShell');
                    shell.classList.toggle('fullscreen');
                    var icon = fsBtn.querySelector('i');
                    if (shell.classList.contains('fullscreen')) {
                        icon.classList.remove('fa-expand'); icon.classList.add('fa-compress');
                        document.body.style.overflow = 'hidden';
                    } else {
                        icon.classList.remove('fa-compress'); icon.classList.add('fa-expand');
                        document.body.style.overflow = '';
                    }
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key !== 'Escape') return;
                    var shell = document.getElementById('pdfShell');
                    if (shell && shell.classList.contains('fullscreen')) {
                        shell.classList.remove('fullscreen');
                        var ic = fsBtn.querySelector('i');
                        ic.classList.remove('fa-compress'); ic.classList.add('fa-expand');
                        document.body.style.overflow = '';
                    }
                });
            }

            function renderItem(type, item, pdfSizeBytes) {
                document.title = item.title + ' – QG Analysis';

                var freqLabels = { semaine: 'Hebdomadaire', mois: 'Mensuel', autre: 'Autre' };
                var kicker = type === 'rapport' ? '<i class="fas fa-file-lines"></i> Rapport' : '<i class="fas fa-newspaper"></i> Actualité';
                var freqHtml = (type === 'rapport' && item.frequency) ? '<span><i class="fas fa-clock-rotate-left"></i>' + escapeHtml(freqLabels[item.frequency] || '') + '</span>' : '';
                var authorHtml = (type === 'article' && item.author) ? '<span><i class="fas fa-user-pen"></i>' + escapeHtml(item.author) + '</span>' : '';

                var heroHtml =
                    '<section class="viewer-hero"><div class="viewer-hero-inner">' +
                        '<span class="viewer-kicker">' + kicker + '</span>' +
                        '<h1 class="viewer-title">' + escapeHtml(item.title) + '</h1>' +
                        '<div class="viewer-meta">' +
                            '<span><i class="fas fa-calendar"></i>' + formatDate(item.date) + '</span>' +
                            authorHtml +
                            freqHtml +
                        '</div>' +
                        '<p class="viewer-desc">' + escapeHtml(item.description) + '</p>' +
                    '</div></section>';

                var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

                var bodyHtml;
                if (item.pdf) {
                    var pdfFileName = item.pdfName || 'document.pdf';
                    setupDownloadBtn(item, pdfFileName);
                    var usePdfCard = isMobile || pdfSizeBytes > LARGE_PDF_BYTES;

                    if (usePdfCard) {
                        bodyHtml = buildPdfCardHtml(item, pdfFileName, pdfSizeBytes, isMobile ? '' : 'desktop-pdf-card', isMobile);
                    } else {
                        bodyHtml = buildPdfIframeHtml(item, pdfFileName, pdfSizeBytes);
                    }
                } else if (type === 'article' && hasArticleContent(item)) {
                    bodyHtml = renderArticleBody(item);
                } else if (item.link) {
                    window.location.replace(item.link);
                    return;
                } else {
                    var coverHtml = item.image ? '<img class="viewer-cover" src="' + item.image + '" alt="' + escapeHtml(item.title) + '">' : '';
                    bodyHtml = coverHtml + '<div class="no-pdf"><i class="fas fa-file-circle-question"></i><h3>Aucun document associé</h3><p>Cet article ne contient pas de document PDF.</p></div>';
                }

                root.innerHTML = heroHtml + '<div class="viewer-content">' + bodyHtml + '</div>';

                if (item.pdf && (isMobile || pdfSizeBytes > LARGE_PDF_BYTES)) {
                    var loadBtn = document.getElementById('loadPdfInlineBtn');
                    var inlineHost = document.getElementById('pdfInlineHost');
                    var pdfCard = document.getElementById('pdfCard');
                    if (loadBtn && inlineHost) {
                        loadBtn.addEventListener('click', function() {
                            if (pdfCard) pdfCard.style.display = 'none';
                            mountPdfIframe(item, item.pdfName || 'document.pdf', pdfSizeBytes, inlineHost);
                            inlineHost.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        });
                    }
                } else if (item.pdf) {
                    setupFullscreen();
                    var pdfFrame = document.getElementById('pdfFrame');
                    var pdfLoading = document.getElementById('pdfLoading');
                    var pdfFallback = document.getElementById('pdfFallback');
                    if (pdfFrame) {
                        var hideLoading = function() {
                            if (pdfLoading) pdfLoading.classList.add('hidden');
                        };
                        pdfFrame.addEventListener('load', hideLoading);
                        setTimeout(hideLoading, 12000);
                        setTimeout(function() {
                            if (pdfLoading && !pdfLoading.classList.contains('hidden') && pdfFallback) {
                                pdfFallback.classList.add('show');
                            }
                        }, 20000);
                    }
                }
            }
        })();
    </script>

</body>
</html>
